{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
            content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        AutoMarket
        {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet"
            href="{% static 'cars/style.css' %}">
</head>

<body>
<nav class="navbar automarket-navbar">
    <div class="container">
        <a class="navbar-brand automarket-brand"
            href="/">
            AutoMarket
        </a>
        <button class="navbar-toggler menu-button"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#mainMenu"
                aria-controls="mainMenu"
                aria-label="Open menu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>




<div class="offcanvas offcanvas-end automarket-menu"
    tabindex="-1"
    id="mainMenu"
    aria-labelledby="mainMenuLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title"
            id="mainMenuLabel">
            AutoMarket
        </h5>
        <button type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="offcanvas"
                aria-label="Close">
        </button>
    </div>
    <div class="offcanvas-body">
        <div class="menu-links">
            <a href="/"
                class="menu-link">
                <span>⌂</span>
                Home
            </a>
            <a href="{% url 'add_car' %}"
                class="menu-link">
                <span>＋</span>
                Add Car
            </a>
            <a href="/profile/"
                class="menu-link">
                <span>◉</span>
                Profile
            </a>
            <div class="menu-divider"></div>
            <a href="{% url 'login' %}"
                class="menu-link">
                <span>→</span>
                Login
            </a>
            <a href="{% url 'register' %}"
                class="menu-link register-link">
                <span>+</span>
                Register
            </a>
        </div>
    </div>
</div>



<main class="main-content">

    {% block content %}
    {% endblock %}

</main>


<footer class="automarket-footer">
    <div class="container">
        <div class="footer-content">
            <div>
                <h5>
                    AutoMarket
                </h5>
                <p>
                    Buy and sell cars with confidence.
                </p>
            </div>
            <div>
                <small>
                    © 2026 AutoMarket
                </small>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
