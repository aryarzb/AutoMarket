{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow">
            <div class="card-body p-4">

                <h2 class="text-center mb-4">
                    Create Account
                </h2>

                <form method="POST">
                    {% csrf_token %}

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input
                                class="form-control"
                                type="text"
                                name="first_name"
                                required
                            >
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input
                                class="form-control"
                                type="text"
                                name="last_name"
                                required
                            >
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input
                            class="form-control"
                            type="text"
                            name="username"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input
                            class="form-control"
                            type="tel"
                            name="mobile_number"
                            required
                        >
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Password</label>
                            <input
                                class="form-control"
                                type="password"
                                name="password"
                                required
                            >
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input
                                class="form-control"
                                type="password"
                                name="confirm_password"
                                required
                            >
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">State</label>
                            <input
                                class="form-control"
                                type="text"
                                name="state"
                                required
                            >
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="form-label">City</label>
                            <input
                                class="form-control"
                                type="text"
                                name="city"
                                required
                            >
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Address</label>
                            <textarea
                            name="address"
                            required
                            class="form-control"
                            rows="5"
                            ></textarea>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        Register
                    </button>

                </form>

                <hr>

                <p class="text-center mb-0">
                    Already have an account?
                    <a href="{% url 'login' %}">Login</a>
                </p>

            </div>
        </div>
    </div>
</div>

{% endblock %}
